services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: food
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
    ports: ['5434:5432']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://food:food@postgres:5432/food
      REDIS_URL: redis://redis:6379
      RUN_WORKER: 'true'
    ports: ['4000:4000']
    depends_on: [postgres, redis]
