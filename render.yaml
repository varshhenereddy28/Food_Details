services:
  - type: web
    name: food-expiry-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && uvicorn app:app --host 0.0.0.0 --port 4000
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: food-expiry-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: food-expiry-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  - type: worker
    name: food-expiry-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: food-expiry-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: food-expiry-redis
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  - type: web
    name: food-expiry-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false

  - type: keyvalue
    name: food-expiry-redis
    plan: free
    ipAllowList: []

databases:
  - name: food-expiry-db
    plan: free